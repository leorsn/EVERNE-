name: Verify storefront

on:
  push:
    branches:
      - main
      - dev/headless-foundation
  pull_request:
  workflow_dispatch:
    inputs:
      verify_legacy_shopify:
        description: "Explicitly verify archived Edition 01 garment-care SKUs"
        type: boolean
        required: true
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SHOPIFY_STORE_DOMAIN: khps10-rs.myshopify.com
      VITE_SHOPIFY_API_VERSION: 2026-07
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Mac Safari launcher syntax
        run: bash -n scripts/review-safari-mac.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build and verify offline Safari ZIP
        run: npm run build:offline
      # Legacy garment-care collection is not a requirement of the new womenswear preview.
      # It is intentionally still testable through an explicit manual dispatch.
      - name: Verify legacy Shopify Storefront catalog (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_legacy_shopify == true }}
        shell: bash
        env:
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.EVERNE_PUBLIC_STOREFRONT_TOKEN }}
        run: |
          node <<'NODE'
          const endpoint = `https://${process.env.VITE_SHOPIFY_STORE_DOMAIN}/api/${process.env.VITE_SHOPIFY_API_VERSION}/graphql.json`;
          const token = process.env.VITE_SHOPIFY_STOREFRONT_TOKEN;
          if (!token) throw new Error('Legacy verification requires the EVERNE_PUBLIC_STOREFRONT_TOKEN repository secret.');

          const query = `query VerifyEdition01 {
            collection(handle: "edition-01") {
              id
              title
              handle
              products(first: 10) {
                nodes {
                  id
                  title
                  availableForSale
                  variants(first: 10) {
                    nodes {
                      id
                      sku
                      availableForSale
                      price { amount currencyCode }
                    }
                  }
                }
              }
            }
          }`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Shopify-Storefront-Access-Token': token,
            },
            body: JSON.stringify({ query }),
          });

          if (!response.ok) {
            throw new Error(`Storefront API returned HTTP ${response.status}: ${await response.text()}`);
          }

          const payload = await response.json();
          if (payload.errors?.length) {
            throw new Error(`Storefront API GraphQL error: ${JSON.stringify(payload.errors)}`);
          }

          const collection = payload.data?.collection;
          if (!collection) throw new Error('Edition 01 is not visible through the authenticated Storefront API.');

          const expected = new Set(['EV-RS-01', 'EV-GB-01', 'EV-CC-01', 'EV-WH-01', 'EV-FS-01']);
          const received = new Set(
            collection.products.nodes.flatMap((product) =>
              product.variants.nodes.map((variant) => variant.sku).filter(Boolean),
            ),
          );

          const missing = [...expected].filter((sku) => !received.has(sku));
          if (missing.length) throw new Error(`Missing Edition 01 SKUs: ${missing.join(', ')}`);

          console.log(`Shopify connected: ${collection.title} returned all ${expected.size} EVERNE SKUs.`);
          NODE
