name: Verify storefront

on:
  push:
    branches:
      - main
      - dev/headless-foundation
      - audit/launch-readiness-2026-09-29
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SHOPIFY_STORE_DOMAIN: khps10-rs.myshopify.com
      VITE_SHOPIFY_API_VERSION: 2026-07
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify Shopify Storefront catalog
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = `https://${process.env.VITE_SHOPIFY_STORE_DOMAIN}/api/${process.env.VITE_SHOPIFY_API_VERSION}/graphql.json`;

          const query = `query VerifyEdition01 {
            collection(handle: "edition-01") {
              id
              title
              handle
              products(first: 20) {
                nodes {
                  id
                  title
                  availableForSale
                  variants(first: 20) {
                    nodes {
                      id
                      sku
                      availableForSale
                      price { amount currencyCode }
                    }
                  }
                }
              }
            }
          }`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query }),
          });

          if (!response.ok) {
            throw new Error(`Storefront API returned HTTP ${response.status}: ${await response.text()}`);
          }

          const payload = await response.json();
          if (payload.errors?.length) {
            throw new Error(`Storefront API GraphQL error: ${JSON.stringify(payload.errors)}`);
          }

          const collection = payload.data?.collection;
          if (!collection) throw new Error('Edition 01 is not visible through the Storefront API.');

          // The Care Set remains DRAFT until all four manual-care components pass
          // physical sample validation. Verify the eight products that should be
          // Storefront-visible now; Care Set publication remains a separate launch gate.
          const expectedVisible = new Set([
            'EV-CC-01',
            'EV-FS-01',
            'EV-SCB-01',
            'EV-DLB-01',
            'EV-FR-01',
            'EV-WH-01',
            'EV-GB-01',
            'EV-ECB-01',
          ]);

          const received = new Set(
            collection.products.nodes.flatMap((product) =>
              product.variants.nodes.map((variant) => variant.sku).filter(Boolean),
            ),
          );

          const missing = [...expectedVisible].filter((sku) => !received.has(sku));
          if (missing.length) throw new Error(`Missing storefront-visible Edition 01 SKUs: ${missing.join(', ')}`);

          if (received.has('EV-RS-01')) {
            throw new Error('Retired SKU EV-RS-01 is still Storefront-visible.');
          }

          console.log(`Shopify connected: ${collection.title} returned all ${expectedVisible.size} currently Storefront-visible EVERNE SKUs; Care Set remains an explicit draft launch gate.`);
          NODE
